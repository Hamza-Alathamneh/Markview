[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markview"
version = "0.1.0"
description = "a simple MD file viewer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PySide6>=6.11.2"]

[project.scripts]
markview = "markview_app:main"

[tool.setuptools]
py-modules = ["markview_app", "markview_preview", "markview_renderer", "markview_theme"]
